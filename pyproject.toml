[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-ai"
dynamic = ["version"]
description = "Config-driven AI model switching made simple"
authors = [{name = "Umer Sohail", email = "mailtoumersohail@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "llm", "openai", "anthropic", "model-switching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Keep in sync with requirements.txt
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.4.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Keep in sync with requirements-dev.txt
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=24.3.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "types-PyYAML>=6.0.12",
]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.39.0"]
all = ["switchboard-ai[openai,anthropic]"]

[project.urls]
Homepage = "https://github.com/callmeumer/switchboard"
Repository = "https://github.com/callmeumer/switchboard"
Issues = "https://github.com/callmeumer/switchboard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["switchboard*"]

[tool.setuptools.dynamic]
version = {attr = "switchboard.__version__.__version__"}

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow-running tests",
    "requires_api: Tests requiring real API keys",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
