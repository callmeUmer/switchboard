# Production Configuration
# Optimized for production with premium models and robust fallbacks
#
# Entries are named by role rather than by model ID, so moving to a newer
# model is a one-line change to model_name. temperature is left unset: newer
# models (current Claude models, OpenAI reasoning models) reject non-default
# values, and switchboard only sends it when configured. max_tokens includes
# reasoning/thinking tokens on these models, so leave generous headroom.

models:
  # Premium Models for Production
  openai-smart:
    provider: openai
    model_name: gpt-6-astra
    api_key_env: OPENAI_API_KEY
    max_tokens: 16000
    timeout: 120

  claude-smart:
    provider: anthropic
    model_name: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 16000
    timeout: 120

  openai-balanced:
    provider: openai
    model_name: gpt-6-sol
    api_key_env: OPENAI_API_KEY
    max_tokens: 16000
    timeout: 60

  claude-balanced:
    provider: anthropic
    model_name: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 16000
    timeout: 60

tasks:
  # Production tasks with comprehensive fallback chains
  coding:
    primary_model: openai-smart
    fallback_models: [claude-smart, openai-balanced, claude-balanced]
    description: "Production code generation and analysis"

  analysis:
    primary_model: claude-smart
    fallback_models: [openai-smart, claude-balanced, openai-balanced]
    description: "Critical analysis and decision making"

  customer_support:
    primary_model: claude-balanced
    fallback_models: [openai-balanced, claude-smart]
    description: "Customer-facing interactions"

default_model: openai-smart
default_fallback: [claude-smart, openai-balanced, claude-balanced]
