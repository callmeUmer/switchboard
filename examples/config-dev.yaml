# Development Configuration
# Optimized for development with cost-effective models
#
# Entries are named by role rather than by model ID, so moving to a newer
# model is a one-line change to model_name. temperature is left unset: newer
# models (current Claude models, OpenAI reasoning models) reject non-default
# values, and switchboard only sends it when configured.

models:
  # Cost-effective cloud models for development
  openai-fast:
    provider: openai
    model_name: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    timeout: 30

  claude-fast:
    provider: anthropic
    model_name: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    timeout: 30

tasks:
  coding:
    primary_model: openai-fast
    fallback_models: [claude-fast]
    description: "Development coding tasks"

  chat:
    primary_model: claude-fast
    fallback_models: [openai-fast]
    description: "Development chat and testing"

default_model: openai-fast
default_fallback: [claude-fast]
