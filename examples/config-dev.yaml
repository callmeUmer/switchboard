# Development Configuration
# Optimized for development with cost-effective models

models:
  # Cost-effective cloud models for development
  gpt-4o-mini:
    provider: openai
    model_name: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 2048
    temperature: 0.7
    timeout: 30

  gpt-3.5-turbo:
    provider: openai
    model_name: gpt-3.5-turbo
    api_key_env: OPENAI_API_KEY
    max_tokens: 2048
    temperature: 0.7
    timeout: 30

  claude-3-haiku:
    provider: anthropic
    model_name: claude-3-haiku-20240307
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
    temperature: 0.7
    timeout: 30

tasks:
  coding:
    primary_model: gpt-4o-mini
    fallback_models: [claude-3-haiku, gpt-3.5-turbo]
    description: "Development coding tasks"

  chat:
    primary_model: claude-3-haiku
    fallback_models: [gpt-4o-mini, gpt-3.5-turbo]
    description: "Development chat and testing"

default_model: gpt-4o-mini
default_fallback: [claude-3-haiku, gpt-3.5-turbo]
